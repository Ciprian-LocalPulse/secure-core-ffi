[package]
name = "secure-core-ffi"
version = "0.3.14"
edition = "2021"
authors = ["Ciprian Ștefan Pleșca"]
description = "Nucleu de securitate criptografic (AES-256-GCM) expus prin FFI pentru integrare multi-limbaj"
license = "Apache-2.0"
repository = "https://github.com/Ciprian-LocalPulse/secure-core-ffi"
readme = "README.md"
keywords = ["cryptography", "aes-gcm", "ffi", "wasm", "security"]
categories = ["cryptography", "wasm"]

[lib]
name = "security_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.10"
libc = "0.2"
# NOTA: nu declaram `rand` direct - codul nostru nu il foloseste nicaieri
# (OsRng vine din `aead`, re-exportat de `aes-gcm`). O dependenta `rand`
# neutilizata a fost eliminata, pentru ca doar genera propuneri automate
# de update de la Dependabot fara niciun beneficiu real.

# getrandom trebuie sa foloseasca sursa de entropie a browserului cand tinta e wasm32.
# Versiunea 0.2 cu feature-ul "js" e ceruta transitiv de `aead`/`crypto-common`
# (folosit intern de aes-gcm pentru OsRng) - nu de codul nostru direct.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
