[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-core-ffi"
version = "0.3.3"
description = "Python ctypes binding for the secure-core-ffi AES-256-GCM core"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ciprian Ștefan Pleșca"}]

[tool.setuptools]
py-modules = ["security_core"]
